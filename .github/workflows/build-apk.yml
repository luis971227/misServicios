name: Compilar APK misServicios

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Firma fija (keystore debug del repo)
        run: |
          mkdir -p "$HOME/.android"
          base64 -d .github/debug.keystore.b64 > "$HOME/.android/debug.keystore"

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: misServicios-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar en release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
