name: Compilar APK misServicios

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Firma fija (keystore debug del repo)
        run: |
          if [ -f .github/debug.keystore.b64 ]; then
            base64 -d .github/debug.keystore.b64 > "$GITHUB_WORKSPACE/.github/fixed.keystore"
            echo "MISERVICIOS_KEYSTORE=.github/fixed.keystore" >> "$GITHUB_ENV"
            mkdir -p "$HOME/.android"
            cp "$GITHUB_WORKSPACE/.github/fixed.keystore" "$HOME/.android/debug.keystore"
          else
            echo "Sin keystore fijo: se genera uno temporal"
          fi

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verificar firma del APK
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256" || true

      - name: Publicar artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: misServicios-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar en release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
