name: Generar keystore debug fijo

on:
  workflow_dispatch:

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generar keystore debug
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storetype PKCS12 \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Publicar como artefacto (base64)
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore-b64
          path: debug.keystore
          retention-days: 5
